name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Installer Node.js 25 et activer le cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile

      - name: Vérifier les types
        run: pnpm typecheck

      - name: Exécuter les tests
        run: pnpm test
